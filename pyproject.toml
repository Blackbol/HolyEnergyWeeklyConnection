[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holy-energy-weekly-connection"
version = "0.2.0"
description = "Automates the weekly login to fr.holy.com to earn 25 HOLY Coins loyalty points."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alexandre Limongi (Blackbol)", email = "Alexlimongi30@gmail.com" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
holy-connect = "holy_energy_weekly_connection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff: linter + formatter ---
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["holy_energy_weekly_connection"]

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
